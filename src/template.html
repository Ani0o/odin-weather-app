<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="header">
      <div class="title">
        <img src="icons/weather.svg" />
        <h1>Weather</h1>
      </div>
      <div class="search">
        <form>
          <label for="location">Location:</label>
          <input type="text" id="location" placeholder="City name" required />
          <button type="submit">Search</button>
        </form>
      </div>
    </div>

    <div class="main-content">
      <div class="location-wrapper">
        <p class="address"></p>
        <div class="unit-changer">
          <button class="celsius selected-unit">&deg;C</button>
          <button class="fahrenheit">&deg;F</button>
        </div>
      </div>
      <div class="temp-wrapper">
        <img />
        <p class="temp"></p>
        <p class="temp-unit"></p>
      </div>
      <p class="weather-details condition"></p>
      <p class="weather-details feelslike"></p>
      <p class="weather-details humidity"></p>
      <p class="weather-details windspeed"></p>
    </div>
  </body>
</html>
